name: Verify live Ravrent Mechanic
on:
  workflow_dispatch:
jobs:
  live-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Check main website response
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 20 -o /tmp/website.html https://ravrent-mechanic.vercel.app/
          grep -q 'Ravrent Mechanic' /tmp/website.html
      - name: Check public guide articles
        run: |
          curl --fail --location --silent --show-error --max-time 20 -o /tmp/guides.html https://ravrent-mechanic.vercel.app/guides.html
          grep -q 'Cold-start engine rattles' /tmp/guides.html
      - name: Check server and configuration presence (not real AI)
        run: |
          curl --fail --location --silent --show-error --max-time 20 https://ravrent-mechanic.vercel.app/api/health -o /tmp/health.json
          node -e "const d=require('/tmp/health.json'); if(d.server!=='online')process.exit(1);console.log('server:',d.server,'assistant:',d.assistant,'AI credentials NOT verified')"
      - name: Check offline diagnostic tools bundle
        run: |
          curl --fail --location --silent --show-error --max-time 20 -o /tmp/tools.js https://ravrent-mechanic.vercel.app/diagnostic-tools.js
          grep -q 'Guided Diagnostics' /tmp/tools.js
      - name: Confirm ad loader disabled on chat
        run: |
          if grep -q 'src="/ads.js"' /tmp/website.html; then echo 'Ads must not be in private chat'; exit 1; fi
